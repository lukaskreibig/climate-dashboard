# Secrets rotate in the Railway dashboard, not here. After rotating the Postgres
# password (last: 23 Oct 2026, after the Railway incident of 21 Oct) every service
# that holds DATABASE_URL needs a fresh deployment, because variables are captured
# per deployment. A redeploy of a build from before that incident is refused.

[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "./docker-entrypoint.sh"
restartPolicyType = "ALWAYS"
healthcheckPath = "/health"
healthcheckTimeout = 600