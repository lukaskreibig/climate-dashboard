# AUTHORITATIVE DATA REFRESH.
#
# BUILD THIS FROM main. It is the one setting that does not live in this file,
# and it is the one that broke.
#
# Railway has no config key for the source branch; it lives only in the service's
# deployment trigger. This service was pointed at a branch called `production`
# whose head was from 22 February, 86 commits behind main, and nobody could see
# that from the repository. On 11 July the NSIDC host that old code fetched
# stopped resolving, the job crashed every morning, and the fix that made that
# host a fallback sat on main from 4 August without ever reaching the container.
# Thirty six days of the published story serving stale numbers, from one stale
# branch name in a dashboard.
#
# The trigger now points at main, like the other two services. If you ever see
# this job building from anything else, that is the bug, not the code.
#
# This Railway cron service is the single writer of the story's datasets. It writes
# Postgres, and backend/main.py reads Postgres first. Nothing else is allowed to
# refresh these tables on a schedule. The GitHub Action that used to commit
# backend/data/data.json was demoted to a manual only fallback refresher, see
# .github/workflows/fallback-refresh.yml.
#
# Railway cron does not auto disable, unlike GitHub scheduled workflows, so the
# schedule itself cannot rot from inactivity. What it does not give us is any alert,
# so .github/workflows/data-freshness.yml verifies the served API afterwards and
# opens a GitHub issue when the numbers are stale.

[build]
builder = "DOCKERFILE"
watchPatterns = [
  "data-pipeline/**"
]

[deploy]
# Kept byte for byte in sync with the CMD in data-pipeline/Dockerfile so it makes no
# difference which one Railway ends up executing.
# The fjord step is deliberately NOT here.
#
# update_fjord_data.py recomputes the derived fjord tables from the classified
# series, and it is owned by refresh_fjord_season.py, which calls it after it has
# actually classified new Sentinel-2 days. The observation season runs late
# February to late June, so that happens a handful of times a year, not daily.
#
# Running it from the daily cron as well meant a second writer for the same
# tables on a schedule that never had anything new to write. On 18 August 2026 it
# rewrote them from a stale copy of the analysis: the season window opened at day
# 45 instead of 53, the spring window was one this project had already retired,
# and the raw per scene series was dropped, which emptied the uncertainty bands
# on the published story with no error anywhere.
startCommand = "sh -c \"python3 -u wait_for_db.py && python3 -u update_pipeline.py\""
cronSchedule = "0 6 * * *"

# Cron services must terminate. Railway skips the next scheduled execution while a
# previous one is still Active, so a restart policy that keeps a failed run alive can
# wedge the cron permanently after a single bad day. NEVER lets a failed run die and
# lets tomorrow's tick start clean.
restartPolicyType = "NEVER"
